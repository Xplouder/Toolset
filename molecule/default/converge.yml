---
- name: Converge
  hosts: all
  become: true
  vars:
    test_user: molecule

  pre_tasks:
    - name: Wait for container to be ready
      wait_for_connection:
        timeout: 30

    - name: Initialize pacman keyring
      command: pacman-key --init
      changed_when: false
      failed_when: false

    - name: Populate pacman keyring
      command: pacman-key --populate archlinux
      changed_when: false
      failed_when: false

    - name: Update package database
      command: pacman -Sy --noconfirm
      changed_when: false
      retries: 3
      delay: 5

    - name: Install base packages for testing
      package:
        name:
          - sudo
          - which
          - base-devel
          - git
          - python
        state: present

    - name: Make sure we have a 'wheel' group
      group:
        name: wheel
        state: present

    - name: Allow 'wheel' group to have passwordless sudo
      lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: '^%wheel'
        line: '%wheel ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Create test user
      user:
        name: "{{ test_user }}"
        groups: wheel
        append: yes
        state: present
        createhome: yes
        shell: /bin/bash

    - name: Set environment variables for test user
      lineinfile:
        path: "/home/{{ test_user }}/.bashrc"
        line: "{{ item }}"
        create: yes
        owner: "{{ test_user }}"
        group: "{{ test_user }}"
      loop:
        - "export USER={{ test_user }}"
        - "export HOME=/home/{{ test_user }}"

  tasks:
    - name: Run toolset role
      include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      vars:
        ansible_user_id: "{{ test_user }}"
        ansible_env:
          HOME: "/home/{{ test_user }}"
          USER: "{{ test_user }}"

  post_tasks:
    - name: Display role execution summary
      debug:
        msg: |
          Toolset role execution completed for testing.
          Test user: {{ test_user }}
          Home directory: /home/{{ test_user }}
          Next step: verification tests
