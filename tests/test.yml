---
- name: Test toolset role
  hosts: localhost
  connection: local
  become: false
  
  pre_tasks:
    - name: Ensure test environment is ready
      ansible.builtin.debug:
        msg: |
          Starting toolset role tests
          User: {{ ansible_user_id }}
          Home: {{ ansible_env.HOME }}
          Distribution: {{ ansible_distribution }}

  tasks:
    - name: Include toolset role
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | basename }}"
      vars:
        # Test with safe defaults
        toolset_install_aur_packages: false
        toolset_configure_docker: true
        toolset_backup_existing_configs: true

  post_tasks:
    - name: Run verification tests
      ansible.builtin.include_tasks: verify_installation.yml
      
    - name: Test summary
      ansible.builtin.debug:
        msg: "Toolset role test completed successfully"
