- name: Check if yay is already installed
  command: which yay
  register: yay_installed
  failed_when: false
  changed_when: false
  become: false

- name: Install yay dependencies
  package:
    name:
      - git
      - base-devel
    state: present
  when: yay_installed.rc != 0

- name: Install yay AUR helper
  block:
    - name: Clone yay repository
      git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: /tmp/yay-bin
        force: yes
      become: false

    - name: Build and install yay
      shell: |
        cd /tmp/yay-bin
        makepkg -si --noconfirm --needed
      become: false
      register: yay_build
      changed_when: "'nothing to do' not in yay_build.stdout"

    - name: Clean up yay build directory
      file:
        path: /tmp/yay-bin
        state: absent
      become: false

  when: yay_installed.rc != 0