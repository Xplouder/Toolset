- name: Install Docker and Docker Compose
  package:
    name:
      - docker
      - docker-compose
    state: present

- name: Start and enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: yes
    state: started

- name: Ensure Docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Get current user info
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
  register: current_user_info

- name: Add current user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes
  notify: docker_group_warning

- name: Display Docker group warning
  debug:
    msg: |
      WARNING: User '{{ ansible_user_id }}' has been added to the 'docker' group.
      This grants root-equivalent privileges. Please log out and back in for changes to take effect.
      For security implications, see: https://docs.docker.com/engine/security/#docker-daemon-attack-surface