- name: Check if Sublime Text is already installed
  command: which subl
  register: sublime_installed
  failed_when: false
  changed_when: false

- name: Setup Sublime Text repository
  block:
    - name: Download and add Sublime Text GPG key
      shell: |
        curl -O https://download.sublimetext.com/sublimehq-pub.gpg
        pacman-key --add sublimehq-pub.gpg
        pacman-key --lsign-key 8A8F901A
        rm -f sublimehq-pub.gpg
      args:
        warn: false
      register: gpg_setup
      changed_when: gpg_setup.rc == 0

    - name: Add Sublime Text repository to pacman.conf
      ini_file:
        path: /etc/pacman.conf
        mode: '0644'
        section: sublime-text
        option: Server
        value: https://download.sublimetext.com/arch/stable/x86_64
        backup: yes

    - name: Refresh package databases
      command: pacman -Sy
      changed_when: false

    - name: Install Sublime Text
      package:
        name: sublime-text
        state: present

  when: sublime_installed.rc != 0