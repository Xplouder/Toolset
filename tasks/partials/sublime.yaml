- name: Check if Sublime Text is already installed
  ansible.builtin.command: which subl
  register: sublime_installed
  failed_when: false
  changed_when: false

- name: Setup Sublime Text repository
  when: sublime_installed.rc != 0
  block:
    - name: Download Sublime Text GPG key
      ansible.builtin.get_url:
        url: https://download.sublimetext.com/sublimehq-pub.gpg
        dest: /tmp/sublimehq-pub.gpg
        mode: '0644'

    - name: Add Sublime Text GPG key
      ansible.builtin.shell: |
        set -o pipefail
        pacman-key --add /tmp/sublimehq-pub.gpg
        pacman-key --lsign-key 8A8F901A
        rm -f /tmp/sublimehq-pub.gpg
      register: gpg_setup
      changed_when: gpg_setup.rc == 0

    - name: Add Sublime Text repository to pacman.conf
      community.general.ini_file:
        path: /etc/pacman.conf
        mode: '0644'
        section: sublime-text
        option: Server
        value: https://download.sublimetext.com/arch/stable/x86_64
        backup: yes

    - name: Refresh package databases
      ansible.builtin.command: pacman -Sy
      changed_when: false

    - name: Install Sublime Text
      ansible.builtin.package:
        name: sublime-text
        state: present