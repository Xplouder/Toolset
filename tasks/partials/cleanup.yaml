- name: Clean package cache
  ansible.builtin.shell: |
    set -o pipefail
    cache_size_before=$(du -sh /var/cache/pacman/pkg/ | cut -f1)
    pacman -Sc --noconfirm
    cache_size_after=$(du -sh /var/cache/pacman/pkg/ | cut -f1)
    echo "Cache cleaned: $cache_size_before -> $cache_size_after"
  register: cache_cleanup
  changed_when: true

- name: Find orphaned packages
  ansible.builtin.command: pacman -Qtdq
  register: orphaned_packages
  failed_when: false
  changed_when: false

- name: Remove orphaned packages
  ansible.builtin.command: pacman -Rns --noconfirm {{ orphaned_packages.stdout_lines | join(' ') }}
  when: 
    - orphaned_packages.rc == 0
    - orphaned_packages.stdout_lines | length > 0
  register: orphan_removal
  changed_when: orphan_removal.rc == 0

- name: Display cleanup summary
  ansible.builtin.debug:
    msg: |
      Cleanup completed:
      - {{ cache_cleanup.stdout if cache_cleanup is defined else 'Cache cleanup skipped' }}
      - Orphaned packages removed: {{ orphaned_packages.stdout_lines | length if orphaned_packages.stdout_lines is defined else 0 }}